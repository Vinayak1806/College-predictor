# Render Blueprint — Infrastructure-as-Code for Render deployments.
# Connect your GitHub repo to Render and it will auto-detect this file.
# See: https://docs.render.com/infrastructure-as-code

services:
  - type: web
    name: admission-compass
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    branch: main
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      # --- Database (Neon PostgreSQL) ---
      - key: DATABASE_URL
        sync: false  # Set manually in Render dashboard
      # --- Authentication ---
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        sync: false
      - key: ADMIN_IMPORT_TOKEN
        generateValue: true
      # --- Site configuration ---
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: SECURE_DEPLOYMENT
        value: "true"
      - key: ALLOW_SEARCH_INDEXING
        value: "false"
      - key: RELEASE_ID
        sync: false
      - key: NEXT_PUBLIC_SUPPORT_EMAIL
        value: "admissioncompass.in@gmail.com"
      # --- Google OAuth ---
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # --- Supabase Storage (for PDF uploads) ---
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: "admin-imports"
      # --- Sentry (error monitoring) ---
      - key: SENTRY_DSN
        sync: false
      - key: NEXT_PUBLIC_SENTRY_DSN
        sync: false
      - key: SENTRY_ORG
        sync: false
      - key: SENTRY_PROJECT
        sync: false
      - key: SENTRY_AUTH_TOKEN
        sync: false
      # --- Google Analytics (optional) ---
      - key: NEXT_PUBLIC_GOOGLE_ANALYTICS_ID
        sync: false
      # --- Python runtime (set by Dockerfile) ---
      - key: PYTHON_EXECUTABLE
        value: "/opt/admission-compass-python/bin/python"
